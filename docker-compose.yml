services:
  postgres:
    image: postgres:16-alpine
    mem_limit: 1g
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sro_rankings}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sro_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sro_user} -d ${POSTGRES_DB:-sro_rankings}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  prefect-server:
    image: prefecthq/prefect:3-python3.11
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0
    ports:
      - "127.0.0.1:4200:4200"
    environment:
      PREFECT_HOME: /root/.prefect
      PREFECT_SERVER_API_HOST: "0.0.0.0"
      PREFECT_API_DATABASE_CONNECTION_URL: sqlite+aiosqlite:////root/.prefect/prefect.db
    volumes:
      - prefect_data:/root/.prefect
    networks:
      - sro_network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  scraper-worker:
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 512m
    restart: unless-stopped
    command:
      - sh
      - -c
      - alembic upgrade head && exec python -m src.flows.orchestrator --mode serve
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-sro_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-sro_rankings}}
      PREFECT_API_URL: http://prefect-server:4200/api
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      QUARANTINE_DIR: /app/quarantine
      QUARANTINE_RETENTION_DAYS: ${QUARANTINE_RETENTION_DAYS:-30}
      CIRCUIT_BREAKER_COOLDOWN_HOURS: ${CIRCUIT_BREAKER_COOLDOWN_HOURS:-6}
      MAX_PAGES_PER_CATEGORY: ${MAX_PAGES_PER_CATEGORY:-400}
      ELECTUS_CF_CLEARANCE: ${ELECTUS_CF_CLEARANCE:-}
      RSILKROAD_PAGE_SIZE: ${RSILKROAD_PAGE_SIZE:-100}
      RSILKROAD_INTER_BATCH_DELAY_MIN: ${RSILKROAD_INTER_BATCH_DELAY_MIN:-0.35}
      RSILKROAD_INTER_BATCH_DELAY_MAX: ${RSILKROAD_INTER_BATCH_DELAY_MAX:-0.75}
      RSILKROAD_CF_CLEARANCE: ${RSILKROAD_CF_CLEARANCE:-}
      DISCORD_OPS_WEBHOOK_URL: ${DISCORD_OPS_WEBHOOK_URL:-}
      DISCORD_COMMUNITY_WEBHOOK_URL: ${DISCORD_COMMUNITY_WEBHOOK_URL:-}
    volumes:
      - ./quarantine:/app/quarantine
    networks:
      - sro_network
    healthcheck:
      test: ["CMD-SHELL", "test -w /app/quarantine && kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    mem_limit: 768m
    cpus: "1.0"
    restart: unless-stopped
    command:
      - streamlit
      - run
      - src/dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DASHBOARD_DATABASE_URL: ${DASHBOARD_DATABASE_URL:-}
      DASHBOARD_CACHE_TTL_SECONDS: ${DASHBOARD_CACHE_TTL_SECONDS:-600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MALLOC_ARENA_MAX: "2"
    networks:
      - sro_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sro_network:
    driver: bridge

volumes:
  postgres_data:
  prefect_data:
